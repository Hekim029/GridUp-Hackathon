<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker>
    <style>
      .title{font:700 34px Arial;fill:#0f172a}.sub{font:18px Arial;fill:#475569}.label{font:700 18px Arial;fill:#0f172a}.small{font:15px Arial;fill:#334155}.tiny{font:13px Arial;fill:#475569}.cab{fill:#f8fafc;stroke:#334155;stroke-width:4}.zone{fill:#e2e8f0;stroke:#64748b;stroke-width:2}.control{fill:#ecfeff;stroke:#0891b2;stroke-width:3}.module{fill:#ccfbf1;stroke:#0f766e;stroke-width:4}.sensor{fill:#fff7ed;stroke:#ea580c;stroke-width:3}.wire{fill:none;stroke:#0f766e;stroke-width:4;stroke-dasharray:10 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="920" fill="#ffffff"/>
  <text x="70" y="65" class="title">1600 kVA AG pano icinde izleme modulu yerlesim konsepti</text>
  <text x="70" y="98" class="sub">Kaynak cizim: 1600 x 1500 x 450 mm, ana bara 2 x (100 x 10 mm2), CT 2500/5</text>

  <rect x="90" y="145" width="720" height="680" rx="8" class="cab"/>
  <text x="105" y="850" class="small">On gorunus - olcekli uygulama cizimi degildir</text>
  <rect x="115" y="175" width="500" height="190" class="zone"/>
  <text x="135" y="205" class="label">Ana bara ve giris bolgesi</text>
  <rect x="635" y="175" width="150" height="190" class="control"/>
  <text x="650" y="205" class="label">Olcu</text><text x="650" y="228" class="label">ve kontrol</text>
  <rect x="115" y="390" width="500" height="390" class="zone"/>
  <text x="135" y="420" class="label">5 aktif DSYA + 2 yedek cikis</text>
  <rect x="635" y="390" width="150" height="390" class="control"/>
  <text x="650" y="420" class="label">Sag servis</text><text x="650" y="443" class="label">bolmesi</text>

  <g>
    <rect x="180" y="235" width="55" height="95" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="193" y="285" class="label">L1</text>
    <rect x="300" y="235" width="55" height="95" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="313" y="285" class="label">L2</text>
    <rect x="420" y="235" width="55" height="95" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="433" y="285" class="label">L3</text>
    <circle cx="208" cy="222" r="15" class="sensor"/><circle cx="328" cy="222" r="15" class="sensor"/><circle cx="448" cy="222" r="15" class="sensor"/>
    <text x="155" y="350" class="tiny">T1, T2, T3 bara/terminal yuzey sicakligi</text>
  </g>

  <g>
    <rect x="135" y="465" width="62" height="190" class="control"/>
    <text x="144" y="500" class="small">F1</text><text x="144" y="525" class="tiny">400 A</text>
    <rect x="207" y="465" width="62" height="190" class="control"/>
    <text x="216" y="500" class="small">F2</text><text x="216" y="525" class="tiny">400 A</text>
    <rect x="279" y="465" width="62" height="190" class="control"/>
    <text x="288" y="500" class="small">F3</text><text x="288" y="525" class="tiny">400 A</text>
    <rect x="351" y="465" width="62" height="190" class="control"/>
    <text x="360" y="500" class="small">F4</text><text x="360" y="525" class="tiny">400 A</text>
    <rect x="423" y="465" width="62" height="190" class="control"/>
    <text x="432" y="500" class="small">F5</text><text x="432" y="525" class="tiny">400 A</text>
    <rect x="495" y="465" width="45" height="190" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="503" y="500" class="tiny">Y1</text>
    <rect x="550" y="465" width="45" height="190" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="558" y="500" class="tiny">Y2</text>
  </g>

  <rect x="650" y="485" width="120" height="135" rx="6" class="module"/>
  <text x="666" y="520" class="label">GridUp</text><text x="666" y="545" class="label">izleme</text><text x="666" y="570" class="label">modulu</text>
  <text x="666" y="600" class="tiny">DIN-ray</text>
  <rect x="650" y="650" width="120" height="75" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="666" y="680" class="small">Endustriyel</text><text x="666" y="704" class="small">modem</text>
  <circle cx="590" cy="700" r="18" class="sensor"/><text x="530" y="745" class="tiny">HFCT - uygun toprak/bonding iletkeni</text>
  <circle cx="585" cy="445" r="18" class="sensor"/><text x="465" y="448" class="tiny">T/RH ortam sensoru</text>
  <circle cx="555" cy="190" r="18" class="sensor"/><text x="500" y="168" class="tiny">TVOC optik</text>
  <circle cx="585" cy="405" r="18" class="sensor"/><text x="505" y="390" class="tiny">TVOC optik</text>

  <path d="M600 445 C620 445 625 500 650 520" class="wire"/>
  <path d="M608 700 C625 700 630 610 650 590" class="wire"/>
  <path d="M555 208 C620 250 615 470 650 510" class="wire"/>

  <rect x="865" y="155" width="465" height="630" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="900" y="205" class="label">Yerlesim kurallari</text>
  <text x="900" y="248" class="small">1. Modul, guc barasindan ayrilmis olcu/kontrol bolgesinde</text>
  <text x="925" y="275" class="small">DIN-ray uzerine konumlanir.</text>
  <text x="900" y="320" class="small">2. 24 V DC yardimci besleme sigortali terminalden alinir.</text>
  <text x="900" y="365" class="small">3. RS-485 ve sensor kablolari mevcut kontrol kablo</text>
  <text x="925" y="392" class="small">kanalinda tasinir, bara ve guc kablolarindan ayrilir.</text>
  <text x="900" y="437" class="small">4. TVOC koruma islevi izleme modulunden bagimsiz kalir.</text>
  <text x="900" y="482" class="small">5. HFCT koaksiyel hatti 50 ohm on uca gider. Delik</text>
  <text x="925" y="509" class="small">capi ile iletken boyutu sahada dogrulanir.</text>
  <text x="900" y="554" class="small">6. Sicaklik problari enerji yolunu kesmeden yuzeye</text>
  <text x="925" y="581" class="small">sabitlenir. Nihai yontem saha onayi gerektirir.</text>
  <text x="900" y="626" class="small">7. Kablo bükülmesi, ezilmesi ve servis erisimi montaj</text>
  <text x="925" y="653" class="small">kontrol listesinde ayrica denetlenir.</text>
  <text x="900" y="718" class="tiny">Konsept, resmi pano cizimindeki sag olcu/modem bolgesini esas alir.</text>
  <text x="900" y="742" class="tiny">Nihai montaj koordinatlari enerjisiz saha kesfinde belirlenir.</text>
</svg>
